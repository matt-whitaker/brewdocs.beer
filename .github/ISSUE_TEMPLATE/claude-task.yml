name: Claude Task
description: A well-scoped task for the @claude bot. Mostly prefilled — set the Area, describe the change, trim the paths, submit.
title: "[Claude]: "
# Deliberately NOT auto-applying the `claude` label: that label triggers the bot,
# and the point is to review the filled-in issue first. Apply `claude` after review.
#
# Prefill convention:
#   value:       prefilled, lands in the created issue — use for boilerplate that's
#                true for EVERY task (path menu, standing constraints, format scaffolds).
#   placeholder: grey hint, vanishes on typing, never in the issue — use where a
#                default would be mistaken for the actual request (Summary).
# The bot reads CLAUDE.md for conventions/invariants/constraints; this form is the
# issue-specific delta, plus a light reminder of the constraints most worth repeating.
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The primary surface. One click to orient the bot; give exact paths under "Where the code lives".
      options:
        - App — data layer (model / state / actions)
        - App — a screen (packages/app/src/screen/*)
        - App — components / design primitives
        - Knowledge base (packages/kb)
        - Workflows / CI (.github)
        - Docs (CLAUDE.md, README)
        - Other / cross-cutting
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen and why, in a sentence or two.
      placeholder: e.g. Add a `version` field to the batch model so stored batches can migrate cleanly.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where the code lives
      description: >
        Specific packages, directories, and files. The single highest-value field —
        every path you give is turns the bot doesn't spend rediscovering the repo.
      value: |
        Trim to what applies; add the specific files.

        - App models: packages/app/src/model/
        - State (TanStack Query, suspense hooks): packages/app/src/state/
        - Derived-data actions (_updateX): packages/app/src/actions/
        - Screens: packages/app/src/screen/<screen>/
        - Shared UI primitives: packages/design/src/components/
        - Knowledge base (data + Kb* types): packages/kb/
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: What to change
      description: Concrete, specific requirements — bullet them.
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: patterns
    attributes:
      label: Patterns to follow
      description: An existing file or pattern to mirror, so the output matches repo conventions.
      value: |
        - Follow CLAUDE.md — conventions, invariants, and the section field-templates.
        - Mirror an existing example:
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What NOT to touch or build. Prevents over-engineering and wasted turns.
      value: |
        Standing constraints — always apply, leave these in:
        - Don't hand-edit generated files (routeTree.gen.ts).
        - Don't add lodash; use packages/app/src/utils/func.ts. (lint-enforced)
        - Import intra-app modules via the @/ alias, not ../ parent-relative paths. (lint-enforced)
        - Don't rename anything under packages/kb/data/** — it changes derived ids.
        - Don't run builds here — the Verify workflow runs the gate on the PR.

        Task-specific:
        -
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How you'll know it's done. A short checklist works well.
      value: |
        - [ ]
    validations:
      required: false
