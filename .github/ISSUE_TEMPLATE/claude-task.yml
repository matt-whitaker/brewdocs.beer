name: Claude Task
description: A well-scoped implementation task for Claude Code. Fill in the paths and scope so it doesn't burn turns rediscovering the repo.
title: "[Claude]: "
# NOTE: intentionally NOT auto-applying the `claude` label here, so you can
# review the filled-in issue before it triggers. Add `labels: ["claude"]`
# below if you'd rather it kick off the moment the issue is created.
#
# Fields use `value:` rather than `placeholder:` so the text is prefilled and
# lands in the created issue. Keep defaults to things that are true for *every*
# task here — a worked example left unedited would read as the actual request.
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen and why, in a sentence or two.
      placeholder: |
        What needs to happen, and why.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where the code lives
      description: >
        The package(s), directories, and key files this touches. The single most useful
        field — the more specific, the fewer turns Claude spends searching.
      value: |
        Common packages to provide:

        - App models: packages/app/src/model/
        - State hooks (TanStack Query, suspense): packages/app/src/state/
        - Derived batch data: packages/app/src/actions/
        - Screens: packages/app/src/screen/
        - Shared UI primitives: packages/design/src/components/
        - Knowledge base (data + Kb* types): packages/kb/
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: What to change
      description: Concrete, specific requirements. Bullet them.
    validations:
      required: true

  - type: textarea
    id: patterns
    attributes:
      label: Patterns to follow
      description: Point to an existing file or pattern to mirror, so the output matches your conventions.
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What NOT to touch or build. Prevents over-engineering and wasted turns.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How you'll know it's done. A short checklist works well.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        _Builds run automatically as CI checks on the PR — no need to ask Claude to run
        them here. Just describe the change; verification happens after the PR opens._
