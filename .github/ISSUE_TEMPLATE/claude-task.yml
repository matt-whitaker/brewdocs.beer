name: Claude Task
description: A well-scoped implementation task for Claude Code. Fill in the paths and scope so it doesn't burn turns rediscovering the repo.
title: "[Claude]: "
# NOTE: intentionally NOT auto-applying the `claude` label here, so you can
# review the filled-in issue before it triggers. Add `labels: ["claude"]`
# below if you'd rather it kick off the moment the issue is created.
body:
  - type: markdown
    attributes:
      value: |
        Claude runs on a **fresh checkout with no memory of this repo**, so every field
        you fill in is turns it *doesn't* spend hunting through `packages/*` before it
        writes a line. The two highest-value fields are **Where the code lives** and
        **Out of scope** — be concrete.

        Keep each task small enough to be **one reviewable PR**. Split big features into
        several issues rather than one sprawling one.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen and why, in a sentence or two.
      placeholder: Add a version field to our data models so we can run graceful automatic migrations.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where the code lives
      description: >
        The package(s), directories, and key files this touches. The single most useful
        field — the more specific, the fewer turns Claude spends searching. Adjust the
        examples to your actual paths.
      placeholder: |
        - App models: packages/app/src/model/
        - Knowledge base (data + Kb* types): packages/kb/
        - Migrations: packages/app/migrations/
        - Related: packages/app/src/storage/batches.ts
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: What to change
      description: Concrete, specific requirements. Bullet them.
      placeholder: |
        - Add a `version` field to locally stored and knowledge-base object models.
        - Add a migrations folder using a `v1_v2` naming convention.
        - First migration: unversioned -> v1.
        - Gate migrations on the presence of migrated objects (not a log in local cache),
          so stragglers migrate automatically.
    validations:
      required: true

  - type: textarea
    id: patterns
    attributes:
      label: Patterns to follow
      description: Point to an existing file or pattern to mirror, so the output matches your conventions.
      placeholder: |
        - Mirror the model structure in packages/app/src/model/batch.ts.
        - Follow the TanStack Query suspense-hook pattern in packages/app/src/state/.
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What NOT to touch or build. Prevents over-engineering and wasted turns.
      placeholder: |
        - Don't change the existing BrewDocs data schemas yet.
        - No UI changes.
        - Don't add a migration-history log.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How you'll know it's done. A short checklist works well.
      placeholder: |
        - [ ] All target models carry a `version`.
        - [ ] A v1 migration exists and runs on unversioned objects.
        - [ ] Re-running is idempotent (already-migrated objects are skipped).
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        _Builds run automatically as CI checks on the PR — no need to ask Claude to run
        them here. Just describe the change; verification happens after the PR opens._