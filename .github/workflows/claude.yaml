name: Claude
run-name: "Claude"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # review submissions (approve / request-changes) carry their text in
  # github.event.review.body, not github.event.comment.body
  pull_request_review:
    types: [submitted]
  # issues are label-triggered, not mention-triggered: `opened` is deliberately
  # not subscribed, so creating an issue produces no workflow run at all. Only
  # applying a label does, and only the `claude` label gets past the `if:`.
  issues:
    types: [labeled]

# one Claude run at a time per issue/PR. Queue rather than cancel: killing a run
# midway can leave a half-pushed branch and no PR.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  claude:
    # Scope the mention check per event. `github.event.issue.body` is the issue/PR
    # *description*, not the new comment — checking it on issue_comment re-runs
    # Claude on every comment to any thread whose description mentions @claude
    # (including PRs Claude itself opened).
    #
    # The actor guard stops a self-trigger loop: track_progress posts comments as
    # github-actions[bot], and one quoting "@claude" would otherwise re-enter here.
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # lets Claude read the Verify workflow's logs when a PR gate goes red
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so it can branch from and diff against mainline
          fetch-depth: 0
      # Install as workflow steps, not from inside the run: this costs Claude zero
      # turns, and without it there's no node_modules — `tsc` then resolves to the
      # runner image's global TypeScript (a different major) and fails on config
      # this repo pins as valid. That phantom error once ate half a run.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        env:
          # the gh CLI authenticates from this; without it `gh pr create` fails
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # without this the action looks for an @claude mention and finds none
          # on a label-triggered run
          label_trigger: "claude"
          # keeps mention handling alive alongside the prompt below
          track_progress: true
          # the action's default is to push a branch and hand back a pre-filled
          # PR *link*; this overrides that to open the PR outright
          prompt: |
            Follow the Contributing section of CLAUDE.md for branch naming, commit
            style, and the PR description template.

            When you change code, open a pull request against `mainline` yourself —
            do not stop at pushing a branch and returning a PR link.

            A denied tool call is settled. The permission layer is policy, not a
            syntax problem, so rewording or re-quoting the same operation will be
            denied identically — you are spending turns to learn nothing. Note
            what you couldn't do, and move on. The one documented exception is the
            `$` escape for route filenames, below.

            Dependencies are already installed by the workflow — do not run
            `npm ci` or `npm install`.

            If you changed code, run the build once before opening the PR:
            `npm run build -w packages/app` (and `-w packages/www` if you touched
            it). Record the result under the PR's Verification heading.

            If that build fails, the fault is in the change you just made — fix it.
            Do NOT investigate node, tsc, or dependency versions, and do not go
            looking through node_modules or tsconfig for an explanation. A previous
            run spent eleven turns chasing a toolchain problem that did not exist.
            If two attempts don't fix it, stop and say so in the PR.

            Use Edit / Write / Read for file contents rather than shelling out.

            Before any shell command touching a file under `src/routes/`, read the
            Routing section of CLAUDE.md — param filenames contain `$` and need a
            specific escape. Retrying with different outer quoting never works.

            Run one command per Bash call. Chaining with `&&` or `;` trips the
            "multiple operations" check and the whole call is denied.

            When the work came from an issue, close the loop on it for the
            record: put `Closes #<issue>` in the PR body so GitHub cross-links
            them, and post one short comment on the issue saying what changed
            and linking the PR. A few lines is enough — the PR is the detailed
            record, the issue comment is the pointer to it.

            Keep your task checklist to at most 3-5 coarse, outcome-level items
            ("Add the version field to the models", not one line per file). Group
            related edits under a single item and do not expand into a long
            granular plan. Update the PR comment only at those few milestones —
            a checklist item costs a turn to narrate, so a 10-item list spends
            most of the budget before any code is written.

            Never merge the PR. The maintainer merges.
          # Allowlist by *family*, not per-subcommand — enumerating individual git/gh/npm
          # commands meant every new task discovered a fresh denial. git/gh/npm can't run
          # arbitrary shell, so this stays well short of a blank cheque.
          #
          # Deliberately NOT bare `Bash`: this runner carries GH_TOKEN and the Claude OAuth
          # token in env, and arbitrary shell (curl, cat env) could exfiltrate them. The one
          # residual edge is `npm install <pkg>` running a malicious postinstall script —
          # acceptable because only write-access actors can trigger a run (see the `if:`
          # actor gate). Narrow npm to `Bash(npm run:*),Bash(npm test:*)` to close even that.
          #
          # tiered budget: a label-triggered run is real feature work; an @claude poke on a
          # comment is usually small. (Comments can't live inside the block scalar below —
          # they'd be passed to the CLI as arguments.)
          claude_args: |
            --model sonnet
            --allowedTools "Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*)"
            --max-turns ${{ github.event_name == 'issues' && 40 || 20 }}

      # DEBUGGING AID — remove once tool-permission tuning is settled.
      #
      # The execution log lives on the runner and is destroyed with the job, so it
      # has to be captured here or not at all. `always()` is load-bearing: a denied
      # tool / hit turn cap fails the step above, and a failed run is exactly the one
      # worth inspecting. The log's tool_use / tool_result entries name the denied tool.
      #
      # This repo is public and artifacts on public repos are downloadable by anyone;
      # the log holds the full conversation, so retention is kept to a day.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 1
          if-no-files-found: warn
