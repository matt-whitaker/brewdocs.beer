name: Claude
# ⚠️ A ternary chain because `run-name` has no variables and no `needs` context — this
# shape is the only one available. `>-` folds the newlines to spaces, and YAML parses
# before expressions evaluate, so it is one line by the time it runs. There is no
# substring function in GitHub expressions, so a long title cannot be truncated here.
#
# ⚠️ EVERY CONTINUATION LINE SITS AT THE SAME INDENT as `Claude ·`. A folded scalar keeps
# a *more*-indented line literal, newline and all — indenting the `||` arms to line them
# up reads better and silently leaves real newlines inside the expression.
run-name: >-
  Claude ·
  ${{ github.event_name == 'pull_request'
  && (github.event.pull_request.merged && 'Post-merge' || 'PR closed')
  || contains(github.event.comment.body || github.event.review.body, '@claude/manager') && 'Manager'
  || contains(github.event.comment.body || github.event.review.body, '@claude/researcher') && 'Researcher'
  || contains(github.event.comment.body || github.event.review.body, '@claude/tester') && 'Tester'
  || contains(github.event.comment.body || github.event.review.body, '@claude/writer') && 'Writer'
  || 'Implementor' }}
  · #${{ github.event.issue.number || github.event.pull_request.number }}
  ${{ github.event.issue.title || github.event.pull_request.title }}

# SIX ROLES, ONE WORKFLOW. Manager / Researcher / Implementor / Tester / Writer are jobs
# here rather than separate files to keep the Actions history readable: the role is picked
# by a job-level `if:`, so it is one run per comment with the unselected roles skipping
# inside it. Security is the sixth and runs on merge, not on a comment.
#
# ⚠️ THE HANDLE IN THE COMMENT ROUTES. Not labels.
#
#   "@claude/manager ..."      -> Manager      (issues only — it shapes an epic)
#   "@claude/researcher ..."   -> Researcher   (issues only — it decomposes an epic)
#   "@claude/implementor ..."  -> Implementor  (issue or PR)
#   "@claude/tester ..."       -> Tester       (issue or PR)
#   "@claude/writer ..."       -> Writer       (issue or PR)
#
# ⚠️ A BARE "@claude" DOES NOTHING, deliberately, so a half-typed handle cannot start the
# wrong agent. Labels trigger nothing either — `on.issues` is not subscribed.
#
# ⚠️ BACKLOG WORK IS SCRIPTED, NOT PROMPTED. Every role carries hard-coded hooks around
# its model step, from `packages/claude-team/hooks/`:
#
#   pre   every role      stamp-role-label.sh      stamps @claude/<role> on the issue or PR
#   pre   impl + tester   set-issue-in-progress.sh moves the issue to In Progress on the board
#   post  researcher      file-sub-issues.sh       parents + milestones the epic's sub-issues
#   post  impl/test/write finish-pr.sh             labels the PR, appends `Closes #<issue>`
#   post  impl/test/write open-story-pr.sh         opens the story's PR if it has none
#   merge (no role)       close-merged-work.sh     closes the PR's issues, files them on the board
#
# These used to be prompt instructions, and a model could skip them — the label trail is
# worthless if a run can forget to stamp it. They cost no turns and cannot be forgotten.
#
# ⚠️ EVERY JOB COPIES THEM TO $RUNNER_TEMP AND RUNS THEM FROM THERE. The workflow YAML
# always comes from the default branch; a `run:` path does NOT — it reads the working
# tree, which the model has by then switched to a feature or epic branch. A branch cut
# before a hook landed does not carry it, so the post-hooks died with exit 127 on an epic
# branch holding three of the six scripts. While they were inline `run: |` blocks their
# bodies travelled with the YAML and were immune; moving them to files traded that for
# readability. The stash step runs while the tree is still the default branch, so the copy
# is current by construction, and it sits outside the repo so nothing can commit it.
#
# ⚠️ EACH ROLE'S PROMPT IS A FILE — `.github/agent-prompts/<role>.md`, loaded by the local
# `./.github/actions/load-prompt` composite action. It reads the working tree, so like the
# hooks above it must run BEFORE the model step, which checks out a feature branch partway
# through. It sits second in every job, right after checkout; that position is load-bearing.
# A prompt file cannot hold `${{ }}` — Actions never evaluates inside a file — so anything
# dynamic goes in the model step's env instead (Security's `PR` is the only one today).
#
# ⚠️ PROJECTS_TOKEN appears in `close-merged-work.sh` and `set-issue-in-progress.sh`, and
# nowhere else. It is a long-lived classic PAT covering every project the maintainer owns,
# and secret masking covers logs only — not an API payload a model could write — so it
# stays out of any environment a prompt can read. Step env is per-step, which is what makes
# these two safe: the model step in the same job cannot see it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # review submissions (approve / request-changes) carry their text in
  # github.event.review.body, not github.event.comment.body
  pull_request_review:
    types: [submitted]
  # merge housekeeping only — no model runs on this event
  pull_request:
    types: [closed]

# one Claude run at a time per issue/PR, across all roles. Queue rather than cancel:
# killing a run midway can leave a half-pushed branch and no PR.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  # ── Manager ────────────────────────────────────────────────────────────────────
  # The least-active role. Turns a loosely-defined epic the maintainer drops in into a
  # well-defined one the other two roles can act on. Deliverable is a better epic in the
  # same issue (edit + comment) — never code, never sub-issues, never a PR.
  manager:
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]'
      && github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && contains(github.event.comment.body, '@claude/manager')
    runs-on: ubuntu-latest
    permissions:
      # write purely to push the epic's (empty) integration branch — the prompt
      # forbids committing to it; this role writes no code
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: manager
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.sh "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No `npm ci`: the Manager reads code to shape the epic, it doesn't build.
      - name: Stamp the role label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: manager
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: "$RUNNER_TEMP/agent-bin/stamp-role-label.sh"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ⚠️ track_progress forces the action's TAG MODE, which gates on this phrase
          # independently of our own `if:`. Leave it at the default "@claude" and the
          # action skips in 0s with a placeholder comment, because "@claude/manager"
          # is not a match for "@claude".
          trigger_phrase: "@claude/manager"
          track_progress: true
          prompt: ${{ steps.prompt.outputs.body }}
          # Read-and-write-issues only; no build tools needed for shaping an epic.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Edit,Write,Bash(gh:*),Bash(git:*)"
            --max-turns 40

  # ── Researcher ─────────────────────────────────────────────────────────────────
  # The product owner. Takes a well-defined epic, follows its Research path, does the
  # file-by-file grounding, and breaks the work into implementable sub-issues linked to
  # the epic. Deliverable is sub-issues + an index comment — never code, never a PR.
  researcher:
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]'
      && github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && contains(github.event.comment.body, '@claude/researcher')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: researcher
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.sh "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No `npm ci`: the Researcher reads code and files issues, it doesn't build.
      - name: Stamp the role label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: researcher
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: "$RUNNER_TEMP/agent-bin/stamp-role-label.sh"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ⚠️ track_progress forces the action's TAG MODE, which gates on this phrase
          # independently of our own `if:`. Leave it at the default "@claude" and the
          # action skips in 0s with a placeholder comment, because "@claude/researcher"
          # is not a match for "@claude".
          trigger_phrase: "@claude/researcher"
          track_progress: true
          prompt: ${{ steps.prompt.outputs.body }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Edit,Write,Bash(gh:*),Bash(git:*)"
            --max-turns 80

      - name: File the epic's sub-issues
        if: always() && github.event_name == 'issue_comment' && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: "$RUNNER_TEMP/agent-bin/file-sub-issues.sh"

  # ── Implementor ────────────────────────────────────────────────────────────────
  # The main engineer. Executes issues and handles follow-up engineering (bug fixes,
  # requested changes, merge-conflict resolution). Reads the issue + its comments (and,
  # on a PR, the description + current comments) for context before touching code.
  # Deliverable is code + a PR against mainline. The only role that answers @claude.
  implementor:
    # Per-event trigger check. The actor guard stops a self-trigger loop: track_progress
    # posts as github-actions[bot], and a comment quoting "@claude" would re-enter here.
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude/implementor')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude/implementor')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude/implementor'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # lets Claude read the Verify workflow's logs when a PR gate goes red
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so it can branch from and diff against mainline
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: implementor
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.sh "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.sh
      # Install as workflow steps, not from inside the run: this costs Claude zero turns,
      # and without it `tsc` resolves to the runner image's global TypeScript (a different
      # major) and fails on config this repo pins as valid.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Stamp the role label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: implementor
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: "$RUNNER_TEMP/agent-bin/stamp-role-label.sh"
      - name: Move the issue to In Progress
        env:
          # ⚠️ PROJECTS_TOKEN is safe here and only here: step env is per-step, so the
          # model step below cannot read it. See the Owner post-mortem in CLAUDE.md.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          PROJECT_OWNER: "@me"
          PROJECT_NUMBER: "4"
        run: "$RUNNER_TEMP/agent-bin/set-issue-in-progress.sh"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ⚠️ track_progress forces the action's TAG MODE, which gates on this phrase
          # independently of our own `if:`. Leave it at the default "@claude" and the
          # action skips in 0s with a placeholder comment, because "@claude/implementor"
          # is not a match for "@claude".
          trigger_phrase: "@claude/implementor"
          track_progress: true
          prompt: ${{ steps.prompt.outputs.body }}
          # Allowlist by *family*, not per-subcommand. Deliberately NOT bare `Bash`: this
          # runner carries GH_TOKEN and the Claude OAuth token in env, and arbitrary shell
          # could exfiltrate them. Only write-access actors can trigger a run (see the `if:`
          # actor gate). 80-turn budget: each run is a cold container that re-orients before
          # making the change — the prompt's read-for-context note is the real cost control.
          claude_args: |
            --model opus
            --allowedTools "Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*)"
            --max-turns 80

      - name: Label and link the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: implementor
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/finish-pr.sh"
      - name: Open the story PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: implementor
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/open-story-pr.sh"

  # ── Tester ─────────────────────────────────────────────────────────────────────
  # Owns packages/e2e. The Implementor ships behaviour and writes Testing notes into its
  # PR Handoff; the Tester turns those notes into Playwright specs. Split out because the
  # two jobs pull in opposite directions — an engineer finishing a feature writes the test
  # that passes, and the failure mode this repo actually has (a save that throws inside a
  # fire-and-forget call while lint/tsc/build stay green) is only caught by a test written
  # to distrust the change.
  tester:
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude/tester')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude/tester')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude/tester'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: tester
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.sh "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Browser install as a workflow step, not a Claude turn. Without it the Tester can
      # write specs but never run them, and an unrun test is worse than no test.
      - run: npx playwright install --with-deps chromium
      - name: Stamp the role label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: tester
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: "$RUNNER_TEMP/agent-bin/stamp-role-label.sh"
      - name: Move the issue to In Progress
        env:
          # ⚠️ PROJECTS_TOKEN is safe here and only here: step env is per-step, so the
          # model step below cannot read it. See the Owner post-mortem in CLAUDE.md.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          PROJECT_OWNER: "@me"
          PROJECT_NUMBER: "4"
        run: "$RUNNER_TEMP/agent-bin/set-issue-in-progress.sh"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ⚠️ track_progress forces the action's TAG MODE, which gates on this phrase
          # independently of our own `if:`. Leave it at the default "@claude" and the
          # action skips in 0s with a placeholder comment, because "@claude/tester"
          # is not a match for "@claude".
          trigger_phrase: "@claude/tester"
          track_progress: true
          prompt: ${{ steps.prompt.outputs.body }}
          claude_args: |
            --model sonnet
            --allowedTools "Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*)"
            --max-turns 80

      - name: Label and link the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: tester
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/finish-pr.sh"
      - name: Open the story PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: tester
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/open-story-pr.sh"

  # ── Writer ─────────────────────────────────────────────────────────────────────
  # The tech writer. Owns documentation: every CLAUDE.md, the agent instruction files
  # under .claude/skills, and anything else whose job is to explain rather than run.
  #
  # ⚠️ Split out because CLAUDE.md was the single biggest source of merge conflicts —
  # every role edited it, so two branches touching the same package collided on prose
  # neither of them was really working on. Implementor and Tester now report what needs
  # documenting in their handoff and change no docs themselves.
  writer:
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude/writer')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude/writer')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude/writer'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: writer
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.sh "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.sh
      - name: Stamp the role label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: writer
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: "$RUNNER_TEMP/agent-bin/stamp-role-label.sh"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          trigger_phrase: "@claude/writer"
          prompt: ${{ steps.prompt.outputs.body }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Edit,Write,Bash(git:*),Bash(gh:*)"
            --max-turns 60

      - name: Label and link the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: writer
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/finish-pr.sh"
      - name: Open the story PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: writer
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/open-story-pr.sh"

  # ── Security ───────────────────────────────────────────────────────────────────
  # Reviews what just landed on mainline and files issues for what it finds. Runs on
  # merge rather than on the PR, deliberately: a review that blocks a merge gets
  # argued with, a review that files an issue gets triaged.
  #
  # ⚠️ It opens issues and nothing else — no code, no PRs, no merges.
  security:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'mainline'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: security
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the one value a prompt file can't carry: `${{ }}` is evaluated by Actions in
          # the workflow, never inside a file. Passed as env so security.md stays static
          # and the model's own shell expands it.
          PR: ${{ github.event.pull_request.number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.body }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Bash(git:*),Bash(gh:*)"
            --max-turns 40

  # ── Merge housekeeping ─────────────────────────────────────────────────────────
  # Closes the issues a merged PR finished and files them on the board.
  #
  # ⚠️ NO MODEL. "Parse the closing keyword, close the issue, set one field" is fully
  # determined, and this is the only backlog behaviour that has worked from its first
  # run — everything model-driven took three attempts. It is also why PROJECTS_TOKEN
  # lives here and nowhere a prompt can reach it.
  merge_housekeeping:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && (contains(github.event.pull_request.labels.*.name, '@claude/manager')
        || contains(github.event.pull_request.labels.*.name, '@claude/researcher')
        || contains(github.event.pull_request.labels.*.name, '@claude/implementor')
        || contains(github.event.pull_request.labels.*.name, '@claude/tester')
        || contains(github.event.pull_request.labels.*.name, '@claude/writer')
        || github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.sh "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.sh
      - name: Close and file the PR's issues
        env:
          # Two tokens on purpose. GITHUB_TOKEN reads the PR and closes issues;
          # PROJECTS_TOKEN is a classic PAT that exists only because it can reach
          # user-owned Projects v2, and needs `project` + `read:org` and nothing else.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PROJECT_OWNER: "@me"
          PROJECT_NUMBER: "4"
        run: "$RUNNER_TEMP/agent-bin/close-merged-work.sh"
