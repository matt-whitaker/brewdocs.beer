name: Claude Manager
run-name: "Claude Manager"

# ROLE: Manager — the least-active role. Turns a loosely-defined epic the maintainer
# drops in into a well-defined one the Researcher and Implementor roles can act on.
# Deliverable is a better epic in the same issue (edit + comment) — never code, never
# sub-issues, never a PR.
#
# TRIGGER: the `manager` label on an issue. Nothing else — no @claude, no PR events.
on:
  issues:
    types: [labeled]

concurrency:
  group: claude-manager-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  manager:
    if: |
      github.actor != 'claude[bot]' && github.actor != 'github-actions[bot]' &&
      github.event_name == 'issues' && github.event.label.name == 'manager'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No `npm ci`: the Manager reads code to shape the epic, it doesn't build.
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "manager"
          track_progress: true
          prompt: |
            You are the **Manager** — the product lead who turns a rough, loosely-defined
            epic into a well-defined one the Researcher and Implementor roles can act on.
            You were triggered by the `manager` label on an issue: that issue holds the
            maintainer's rough epic, and it is your input.

            Your deliverable is a **better epic, in this same issue** — NOT code, NOT
            sub-issues, NOT a pull request. Ground lightly in the codebase (see CLAUDE.md
            and the packages it points to) — just enough to make the epic concrete and
            correctly scoped — then rewrite the issue body into a filled-out epic with:

            - **Goal** — what and why.
            - **Proposal** — the rough, conceptual shape of the solution (not per-file).
            - **Constraints** — standing repo rules plus anything specific to this work.
            - **Research path** — a reading list + the open questions the Researcher must
              answer before it can decompose. This is the most valuable part: name exact
              files and CLAUDE.md sections so the next role starts warm rather than
              re-discovering the repo.
            - **Codebase map** — the packages/subsystems and anchor files this touches.
              Confirm every path you name actually exists.

            Update the issue body with `gh issue edit <number> --body-file <file>`, then
            post one short comment summarizing what you filled in and what's still an open
            question for the maintainer. Do NOT create sub-issues, change code, or open a
            PR — that's the Researcher's and Implementor's job once the maintainer hands
            off by applying the `researcher` label.

            Never apply a label to any issue (including this one). Labeling is the
            maintainer's handoff control — leave the epic unlabeled for them to route.

            Operational notes: dependencies are NOT installed and you don't need them —
            don't run `npm ci`/`npm install` or the build. Run one command per Bash call
            (chaining with `&&`/`;` trips the permission check). A denied tool call is
            settled — note it and move on. Use Read for file contents rather than shelling
            out. Before any shell command touching `src/routes/`, read the Routing section
            of CLAUDE.md — param filenames contain `$` and need a specific escape.
          # Read-and-write-issues only; no build tools needed for shaping an epic.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Edit,Write,Bash(gh:*),Bash(git:*)"
            --max-turns 40
