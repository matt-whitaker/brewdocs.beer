name: Verify
run-name: "Verify"

on:
  # ⚠️ NO `branches:` FILTER, deliberately — it matches the PR's BASE, and a task PR's base is
  # its story's branch. Scoped to `mainline` this gate never ran on a task at all: it first
  # fired on the story's PR, after every task had already merged into it, so a red result
  # arrived buried in an accumulated diff instead of on the one task that caused it. Verify is
  # the cheap half of the gate; run it everywhere. Functional test keeps the `mainline` scope
  # — see the root CLAUDE.md's _Deployment_ section for why the two differ.
  pull_request:
    paths:
      # Only code changes need the gate. Docs, agent prompts, hooks and workflow-adjacent
      # files don't compile, lint or build, so a PR touching only those skips this entirely.
      #
      # ⚠️ Negation rather than an explicit package list, deliberately. The dangerous failure
      # is a NEW code package silently never being verified; with `packages/**` it is covered
      # the day it is added. The cost is that a new non-code package under packages/ runs the
      # gate for nothing until it is excluded here — harmless, and visible.
      #
      # ⚠️ packages/claude-team is not an npm workspace: it holds prompts and shell hooks, and
      # `npm test -ws` never sees it.
      - 'packages/**'
      - '!packages/claude-team/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - '.github/workflows/verify.yaml'

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test -ws
      - run: npm run build -ws
