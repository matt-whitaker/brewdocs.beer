name: Functional test
run-name: "Functional test"

on:
  pull_request:
    branches:
      - mainline
    paths:
      # Only code changes need the gate. Docs, agent prompts, hooks and workflow-adjacent
      # files don't compile, lint or build, so a PR touching only those skips this entirely.
      #
      # ⚠️ Negation rather than an explicit package list, deliberately. The dangerous failure
      # is a NEW code package silently never being verified; with `packages/**` it is covered
      # the day it is added. The cost is that a new non-code package under packages/ runs the
      # gate for nothing until it is excluded here — harmless, and visible.
      #
      # ⚠️ Neither packages/claude-team nor packages/spec is an npm workspace — one holds
      # prompts and Python hooks, the other product-specification markdown, and the nx gate
      # never sees either.
      - 'packages/**'
      - '!packages/claude-team/**'
      - '!packages/spec/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - '.github/workflows/functional-test.yaml'

concurrency:
  group: functional-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  functional-test:
    runs-on: ubuntu-latest
    # the suite executes in ~4 minutes; a hang otherwise burns the 6-hour ceiling (#1175's class)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - id: pw-version
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # ⚠️ SKIPPED ENTIRELY ON A CACHE HIT, apt included — deliberately. ubuntu-latest ships
      # chromium's OS dependencies, and apt is the half that hangs (#1175 measured three runs
      # burning toward the 6-hour ceiling on it). If a browser-launch failure ever appears after
      # a runner-image update, the fallback is `npx playwright install-deps chromium` on hit.
      # The key carries the playwright version, so an upgrade re-seeds the cache (#1179).
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w packages/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7